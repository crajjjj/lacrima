# Lacrima - procedural tears.
#
# These are the defaults. Don't edit this file to tune your game: use the Lacrima
# pages in the SKSE Menu Framework, which save only what you change into
# Lacrima_User.toml next to this file, or write that file by hand with the same
# sections and keys. An update replaces this file and never touches yours.

[general]
enabled = true
debug_log = false      # face, duct and fluid details in Lacrima.log

[tears]
rate = 12.0            # tears per minute from each eye at full intensity
drop = 6               # fluid particles in one tear at full intensity (2 to 20)
well = 0.9             # seconds a tear takes to gather at the lower lid
hold = 0.8             # seconds a full tear clings to the lid before it runs
duct_position = 0.3    # where tears start: 0 = inner corner of the eye, 1 = outer corner
duct_below = 0.9       # how far below the middle of the eye, in eye sizes
both_eyes = true       # false: one eye, picked at random each time crying starts
max_actors = 6         # actors crying at once; the oldest stops past this
max_particles = 160    # fluid on one cheek at most
max_distance = 3000    # game units from the camera; farther actors' tears pause where they are (trails still dry)

[look]
size = 1.0             # drop size; real tears are about 1, bigger reads better from afar
trail = 0.8            # width of the wet trail a tear leaves
opacity = 0.55
shine = 3.0            # strength of the wet highlight
gloss = 160.0          # sharpness of the highlight
lifetime = 30.0        # seconds a trail stays wet
fade = 5.0             # seconds at the end of its life a trail spends thinning out

[physics]
stickiness = 0.3       # how firmly a slow tear sticks to the skin and stops
friction = 45.0        # drag on a tear running over skin; higher runs slower
viscosity = 20.0       # how much a tear moves as one; water is low
cohesion = 2.5         # how strongly a tear holds together as a bead
stretch = 3.0          # how easily a running tear stretches into a trail
fall = 0.6             # seconds a drop that falls off the face stays visible

[wipe]
hands = true           # a crying actor's own hand takes away the tears it touches, in any animation
absorb = 0.15          # seconds a tear touched by a hand lasts
reach = 7.0            # in a wipe gesture, how close the hand must come to the eyes (game units)
gesture_wait = 3.5     # seconds a wipe gesture waits for the hand before drying the face anyway

[debug]
show_ducts = false     # mark where tears start on the console-selected actor, or the player
