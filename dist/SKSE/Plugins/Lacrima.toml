# Lacrima - procedural tears.
#
# These are the defaults. Don't edit this file to tune your game: use the Lacrima
# pages in the SKSE Menu Framework, which save only what you change into
# Lacrima_User.toml next to this file, or write that file by hand with the same
# sections and keys. An update replaces this file and never touches yours.

[general]
enabled = true
debug_log = false      # face, duct and fluid details in Lacrima.log, and a status line every 10 s while anyone cries

[tears]
rate = 12.0            # tears per minute from each eye at full intensity
drop = 4               # fluid particles in one tear at full intensity (2 to 20); a real tear is small
well = 0.9             # seconds a tear takes to gather at the lower lid
hold = 0.8             # seconds a full tear clings to the lid before it runs
duct_position = 0.3    # where tears start: 0 = inner corner of the eye, 1 = outer corner
duct_below = 0.9       # how far below the middle of the eye, in eye sizes
streams = 2            # points along the lower lid tears can start from (1 to 4); each tear picks one at random
stream_spread = 0.6    # how far apart the streams sit along the lid, as a fraction of its length, centred on duct_position
variety = 0.5          # how much one tear differs from the next: start point on the lid, size, a second tear right after; 0 = all alike
both_eyes = true       # false: one eye, picked at random each time crying starts
max_actors = 6         # actors crying at once; the oldest stops past this
max_particles = 160    # fluid on one cheek at most
max_distance = 3000    # game units from the camera; farther actors' tears pause where they are (trails still dry)

[look]
style = 0              # 0 water (reflective, faint glow); 1 plain (no glow, no reflection: try it if tears look white and solid under an ENB preset); 2 refraction (plain + the scene bends through the water, experimental)
refraction = 0.3       # in the refraction style, how strongly the scene behind bends through a tear
size = 0.8             # drop size; real tears are about 1, bigger reads better from afar
trail = 1.2            # width of the wet trail a tear leaves
opacity = 0.3          # how much the water hides the skin; the rest shows through
shine = 6.0            # strength of the wet highlight
gloss = 300.0          # sharpness of the highlight
reflection = 1.0       # how much of the surroundings the water reflects; 0 is matte
glow = 0.06            # a faint light of the water's own, so a streak reads as a light wet line from any angle; 0 none
eye_shine = 1.6        # wet eyes: how much brighter and more reflective the eyes get while crying (1 = unchanged)
lifetime = 30.0        # seconds a trail stays wet
fade = 5.0             # seconds at the end of its life a trail spends thinning out
mascara = 0.0          # running mascara: tears leave a dark streak that outlives the water; 0 none, up to 1 (mods can set it per actor)
mascara_opacity = 0.5  # how dark a mascara streak is
mascara_width = 1.0    # how wide a mascara streak is
mascara_smudge = 1.0   # how much mascara gathers in a dark band under the lower lid; 0 none
mascara_lifetime = 300.0  # seconds a streak stays before it has faded away; a hand wipe smears it and it goes sooner

[physics]
stickiness = 2.0       # how firmly a tear sticks to the skin; a full bead still runs, the thin trail behind it stops
friction = 30.0        # drag on a tear running over skin; higher runs slower (30: a bead runs about 2 cm a second)
viscosity = 20.0       # how much a tear moves as one; water is low
cohesion = 2.5         # how strongly a tear holds together as a bead
stretch = 3.0          # how easily a running tear stretches into a trail
trail_step = 2.5       # a running tear leaves a drop behind every this many cm, so a 4-drop tear runs about 7 cm and stops
cling = 2.0            # seconds a drop hangs under the chin before it falls (a lone drop twice this, a heavy bead less)
fall = 0.6             # seconds a drop that falls off the face stays visible

[wipe]
hands = true           # a crying actor's own hand takes away the tears it touches, in any animation
absorb = 0.15          # seconds a tear touched by a hand lasts
reach = 7.0            # in a wipe gesture, how close the hand must come to the eyes (game units)
gesture_wait = 3.5     # seconds a wipe gesture waits for the hand before drying the face anyway

[debug]
show_ducts = false     # mark where tears start on the console-selected actor, or the player (two beads under the eyes)
mount_world = false    # false: tears hang under the head bone and move with it in the same frame; true: drawn in world space under the cell node, which runs a frame behind a turning head (marks flicker)
